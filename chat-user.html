<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLG Bullion - Live Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-dark-bg: #111111;
            --color-medium-dark: #151920;
            --color-gold-accent: #FFD700;
            --color-text-light: #E6E9EE;
            --color-text-fade: #9aa0b3;
            --color-positive: #00B050;
            --color-info: #3498db;
            --color-white: #FFFFFF;

            --bg: var(--color-dark-bg);
            --panel: var(--color-medium-dark);
            --muted: var(--color-text-fade);
            --text: var(--color-text-light);
            --gold: var(--color-gold-accent);
            --shadow: 0 18px 50px rgba(0,0,0,0.18);
        }

        body {
            font-family: 'Noto Sans Myanmar', 'Noto Sans Thai', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--color-dark-bg);
            color: var(--color-text-light);
            margin: 0;
            padding: 0;
        }

        .dashboard-container { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px;
            background: var(--panel);
            padding: 20px 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .logo-section { padding: 0 20px 20px 20px; margin-bottom: 10px; border-bottom: 1px solid #3A3A3A; display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #FFD700; object-fit: cover; }
        .logo-text-group { display: flex; flex-direction: column; }
        .logo-y-text { font-size: 24px; font-weight: 800; color: #FFD700; line-height: 1; }
        .logo-subtext { font-size: 16px; font-weight: 700; color: #FFFFFF; letter-spacing: 1px; }
        .logo-company { font-size: 8px; color: #A0A0A0; margin-top: 2px; }

        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: var(--color-text-fade);
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .sidebar-nav .nav-item:hover,
        .sidebar-nav .nav-item.active {
            background-color: #383838;
            color: var(--color-text-light);
            border-left: 5px solid var(--color-gold-accent);
        }
        .sidebar-nav i { margin-right: 15px; width: 20px; text-align: center; }

        .auth-control-box { padding: 20px; border-top: 1px solid #3A3A3A; }

        .sidebar-lang-box {
            padding: 10px 20px;
            border-bottom: 1px solid #3A3A3A;
            margin-bottom: 10px;
        }
        .lang-dropdown {
            position: relative;
        }
        .lang-btn-trigger {
            width: 100%;
            background: none;
            border: none;
            color: var(--color-text-light);
            text-align: left;
            cursor: pointer;
            padding: 8px 0;
        }
        .lang-list {
            display: none;
            background: #252525;
            border-radius: 6px;
            overflow: hidden;
            position: absolute;
            width: 180px;
            left: 20px;
            z-index: 1001;
        }
        .lang-item {
            padding: 10px;
            color: #ddd;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .lang-item:last-child {
            border-bottom: none;
        }
        .lang-item:hover {
            background: #333;
        }

        .main-content { flex-grow: 1; margin-left: 280px; padding: 20px 40px; box-sizing: border-box; }
        .main-header { padding: 10px 0 20px; }
        .main-header h2 { margin: 0 0 5px; font-size: 28px; }
        .main-header p { margin: 0; color: var(--color-text-fade); font-size: 13px; }

        .chat-container { display: flex; height: calc(100vh - 180px); background: linear-gradient(135deg, var(--color-medium-dark) 0%, #252525 100%); border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .chat-window { flex-grow: 1; display: flex; flex-direction: column; }
        .chat-header { background: linear-gradient(90deg, #333 0%, #2a2a2a 100%); padding: 15px 20px; color: var(--color-gold-accent); font-weight: bold; border-bottom: 1px solid #444; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .message { max-width: 75%; padding: 12px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .user-message { background-color: var(--color-info); align-self: flex-end; border-bottom-right-radius: 4px; }
        .admin-message { background-color: #444; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message-time { display: block; margin-top: 5px; font-size: 10px; color: #AAA; }

        .chat-input { padding: 15px; background: #222; display: flex; gap: 10px; border-top: 1px solid #444; align-items: center; }
        .chat-input input[type="text"] { flex-grow: 1; padding: 12px 14px; background: #111; border: 1px solid #444; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-input button { background: var(--color-gold-accent); border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; color: #000; transition: filter 0.2s ease; }
        .chat-input button:hover { filter: brightness(1.05); }
        .img-upload-btn { background: #333 !important; color: var(--color-gold-accent) !important; width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-text-fade); text-align: center; }
        .empty-state i { font-size: 42px; margin-bottom: 18px; color: var(--color-gold-accent); }
        .empty-state a { color: var(--color-gold-accent); text-decoration: underline; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; padding: 10px 0; }
            .sidebar-nav { display: flex; flex-wrap: wrap; justify-content: center; }
            .main-content { margin-left: 0; padding: 15px; width: 100%; }
            .chat-container { height: 520px; }
            .message { max-width: 85%; }
        }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="logo.png" class="logo-img" alt="YLG" onerror="this.src='https://ui-avatars.com/api/?name=YLG&background=FFD700&color=000&bold=true'">
                <div class="logo-text-group">
                    <div class="logo-y-text">YLG</div>
                    <div class="logo-subtext">BULLION</div>
                    <div class="logo-company">INTERNATIONAL CO., LTD.</div>
                </div>
            </div>
            <!-- Language selection removed - uses dashboard's language setting from localStorage -->
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="trading.html" class="nav-item"><i class="fas fa-chart-line"></i> Trading</a>
                <a href="portfolio.html" class="nav-item"><i class="fas fa-briefcase"></i> Portfolio</a>
                <a href="history.html" class="nav-item"><i class="fas fa-history"></i> History</a>
                <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i> Wallet</a>
                <a href="kyc.html" class="nav-item"><i class="fas fa-user-check"></i> KYC</a>
                <a href="chat-user.html" class="nav-item active"><i class="fas fa-headset"></i> Live Support</a>
            </nav>
            <div class="auth-control-box">
                <div id="sidebar-logged-out">
                    <a href="login.html" style="color: var(--color-gold-accent); text-decoration: none; font-size: 14px;">Login / Register</a>
                </div>
                <div id="sidebar-logged-in" style="display: none;">
                    <div style="display: flex; align-items: center; gap: 10px; justify-content: center;">
                        <i class="fas fa-user-circle" style="font-size: 24px; color: var(--color-gold-accent);"></i>
                        <span id="user-display-name" style="font-weight: bold; font-size: 13px;">User</span>
                    </div>
                    <button onclick="logout()" style="width:100%; margin-top:10px; background:none; border:1px solid #555; color:#ff4444; cursor:pointer; padding:8px; border-radius:4px; font-size:12px;">Logout</button>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h2>Live Support Chat</h2>
                <p>Connect with our support team instantly • Send messages and images</p>
            </header>
            <div class="chat-container">
                <div class="chat-window">
                    <div class="chat-header"><i class="fas fa-user-shield"></i> Support Agent (Online)</div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading chat history...</p>
                        </div>
                    </div>
                    <div class="chat-input">
                        <input type="file" id="chat-image-input" accept="image/*" style="display:none;">
                        <button class="img-upload-btn" id="image-upload-btn" title="Upload Image"><i class="fas fa-image"></i></button>
                        <input type="text" id="chat-input-field" placeholder="Type your message here...">
                        <button id="send-btn"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
    import { app } from "./firebase-init.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let currentUserEmail = null;

    const langTexts = {
        en: {
            pageTitle: 'YLG Bullion - Live Support',
            pageHeading: 'Live Support Chat',
            subtitle: 'Connect with our support team instantly • Send messages and images',
            supportLabel: 'Support Agent (Online)',
            inputPlaceholder: 'Type your message here...',
            sendButton: 'Send',
            loginPromptHtml: 'Please <a href="login.html">login</a> to access live support chat.',
            welcomeLabel: 'Welcome! Thanks for reaching out. Our support team is here to help. How can we assist you today?',
            youLabel: 'You',
            supportLabelShort: 'Support',
            nav: ['Dashboard', 'Trading', 'Portfolio', 'History', 'Wallet', 'KYC', 'Live Support']
        },
        mm: {
            pageTitle: 'YLG Bullion - တိုက်ရိုက် အထောက်အပံ့',
            pageHeading: 'တိုက်ရိုက် အထောက်အပံ့ စကားပြော',
            subtitle: 'ကျွန်ုပ်တို့၏ အထောက်အပံ့အဖွဲ့နှင့် ချက်ချင်း ဆက်သွယ်ပါ • စာသားနှင့် ပုံများ ပို့နိုင်သည်',
            supportLabel: 'အထောက်အပံ့ အေးဂျင့် (အွန်လိုင်း)',
            inputPlaceholder: 'မက်ဆေ့ခ်ျ ထည့်ပါ...',
            sendButton: 'ပို့မည်',
            loginPromptHtml: 'ကျေးဇူးပြု၍ <a href="login.html">login</a> ဝင်ကာ live support chat ကို အသုံးပြုပါ။',
            welcomeLabel: 'ကြိုဆိုပါသည်! မေးမြန်းလိုသောအရာကို ပြောပြပါ။ ကျွန်ုပ်တို့ အကူအညီပေးရန် ရှိပါသည်။',
            youLabel: 'သင်',
            supportLabelShort: 'အထောက်အပံ့',
            nav: ['ပင်မစာမျက်နှာ', 'ရွှေရောင်းဝယ်မှု', 'ပိုင်ဆိုင်မှုစာရင်း', 'အရောင်းအဝယ်မှတ်တမ်း', 'ကျွန်ုပ်၏ ပိုက်ဆံအိတ်', 'KYC', 'တိုက်ရိုက် အထောက်အပံ့']
        },
        th: {
            pageTitle: 'YLG Bullion - ฝ่ายช่วยเหลือสด',
            pageHeading: 'สนับสนุนสด',
            subtitle: 'เชื่อมต่อกับทีมสนับสนุนของเราได้ทันที • ส่งข้อความและรูปภาพได้',
            supportLabel: 'เจ้าหน้าที่สนับสนุน (ออนไลน์)',
            inputPlaceholder: 'พิมพ์ข้อความของคุณที่นี่...',
            sendButton: 'ส่ง',
            loginPromptHtml: 'กรุณา <a href="login.html">เข้าสู่ระบบ</a> เพื่อเข้าถึงแชทสนับสนุนสด.',
            welcomeLabel: 'ยินดีต้อนรับ! โปรดแจ้งสิ่งที่คุณต้องการความช่วยเหลือ ทีมเราพร้อมช่วยเหลือ.',
            youLabel: 'คุณ',
            supportLabelShort: 'ฝ่ายสนับสนุน',
            nav: ['แดชบอร์ด', 'การซื้อขาย', 'พอร์ตโฟลิโอ', 'ประวัติ', 'กระเป๋าเงิน', 'KYC', 'สนับสนุนสด']
        }
    };

    function applyChatLanguage(lang) {
        const langNames = {
            'en': 'English',
            'mm': 'မြန်မာ (Myanmar)',
            'th': 'ไทย (Thai)'
        };

        const display = document.getElementById('display-lang-name');
        if (display) {
            display.innerHTML = `<i class="fas fa-globe"></i> ${langNames[lang] || 'English'}`;
        }

        const texts = langTexts[lang] || langTexts.en;
        document.title = texts.pageTitle;
        const heading = document.querySelector('.main-header h2');
        if (heading) heading.innerText = texts.pageHeading;
        const subtitle = document.querySelector('.main-header p');
        if (subtitle) subtitle.innerText = texts.subtitle;
        const supportHeader = document.querySelector('.chat-header');
        if (supportHeader) supportHeader.innerHTML = `<i class="fas fa-user-shield"></i> ${texts.supportLabel}`;
        const inputField = document.getElementById('chat-input-field');
        if (inputField) inputField.placeholder = texts.inputPlaceholder;
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) sendBtn.innerHTML = `<i class="fas fa-paper-plane"></i> ${texts.sendButton}`;

        const chatMessages = document.getElementById('chat-messages');
        if (chatMessages && !currentUserId) {
            chatMessages.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock"></i>
                    <p>${texts.loginPromptHtml}</p>
                </div>
            `;
        }

        const navItems = document.querySelectorAll('.sidebar-nav .nav-item');
        navItems.forEach((item, idx) => {
            const iconHtml = item.querySelector('i') ? item.querySelector('i').outerHTML : '<i class="fas fa-circle"></i>';
            if (texts.nav[idx]) {
                item.innerHTML = `${iconHtml} ${texts.nav[idx]}`;
            }
        });
    }

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxSide = 800;
                    if (width > height && width > maxSide) { height *= maxSide / width; width = maxSide; }
                    else if (height > maxSide) { width *= maxSide / height; height = maxSide; }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                };
            };
        });
    }

    document.getElementById('image-upload-btn').onclick = () => {
        document.getElementById('chat-image-input').click();
    };

    document.getElementById('chat-image-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (file && currentUserId && currentUserEmail) {
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            try {
                const base64Img = await compressImage(file);
                await addDoc(collection(db, 'chats'), {
                    userId: currentUserId,
                    userEmail: currentUserEmail,
                    message: '[Image]',
                    chatImageUrl: base64Img,
                    isAdmin: false,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error('Error sending image:', error);
                alert('Failed to upload image. Please try again.');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<i class="fas fa-paper-plane"></i> ${langTexts[localStorage.getItem('selectedLang') || 'en'].sendButton}`;
                document.getElementById('chat-image-input').value = '';
            }
        } else {
            alert('Please login first to send images.');
        }
    };

    async function sendMessage() {
        const input = document.getElementById('chat-input-field');
        const text = input.value.trim();
        if (text === '' || !currentUserId || !currentUserEmail) return;
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        try {
            await addDoc(collection(db, 'chats'), {
                userId: currentUserId,
                userEmail: currentUserEmail,
                message: text,
                isAdmin: false,
                timestamp: serverTimestamp()
            });
            input.value = '';
        } catch (error) {
            console.error('Error saving message:', error);
            alert('Failed to send message. Please try again.');
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = `<i class="fas fa-paper-plane"></i> ${langTexts[localStorage.getItem('selectedLang') || 'en'].sendButton}`;
        }
    }

    function listenForMessages() {
        const msgBox = document.getElementById('chat-messages');
        if (!currentUserId) return;

        const q = query(
            collection(db, 'chats'),
            where('userId', '==', currentUserId),
            orderBy('timestamp', 'asc')
        );

        onSnapshot(q, (snapshot) => {
            msgBox.innerHTML = '';
            const currentLang = localStorage.getItem('selectedLang') || 'en';
            const texts = langTexts[currentLang] || langTexts.en;

            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message admin-message';
            welcomeDiv.innerHTML = `
                <div>${texts.welcomeLabel}</div>
                <span class="message-time">${texts.supportLabelShort}</span>
            `;
            msgBox.appendChild(welcomeDiv);

            snapshot.forEach((docItem) => {
                const data = docItem.data();
                const div = document.createElement('div');
                const isFromAdmin = data.isAdmin === true || data.userEmail === 'Admin';
                div.className = isFromAdmin ? 'message admin-message' : 'message user-message';
                const time = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
                let displayContent = '';
                if (data.chatImageUrl) {
                    displayContent = `<img src="${data.chatImageUrl}" class="message-image" style="max-width:100%; border-radius:8px; margin-top:8px; cursor:pointer;" onclick="window.open('${data.chatImageUrl}', '_blank')">`;
                    if (data.message && data.message !== '[Image]') {
                        displayContent = `<div>${data.message}</div>` + displayContent;
                    }
                } else {
                    displayContent = `<div>${data.message || ''}</div>`;
                }
                div.innerHTML = displayContent + `<span class="message-time">${isFromAdmin ? texts.supportLabelShort : texts.youLabel} • ${time}</span>`;
                msgBox.appendChild(div);
            });
            msgBox.scrollTop = msgBox.scrollHeight;
        }, (error) => {
            console.error('Chat Error:', error);
            msgBox.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Failed to load chat. Please refresh the page.</p></div>';
        });
    }

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('chat-input-field').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    onAuthStateChanged(auth, async (user) => {
        const currentLang = localStorage.getItem('selectedLang') || 'en';
        const texts = langTexts[currentLang] || langTexts.en;

        if (user) {
            currentUserId = user.uid;
            currentUserEmail = user.email || 'User';
            const profileName = localStorage.getItem('userName') || currentUserEmail.split('@')[0];
            document.getElementById('sidebar-logged-out').style.display = 'none';
            document.getElementById('sidebar-logged-in').style.display = 'block';
            document.getElementById('user-display-name').innerText = profileName;
            document.getElementById('chat-input-field').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('image-upload-btn').disabled = false;
            applyChatLanguage(currentLang);
            listenForMessages();
        } else {
            currentUserId = null;
            currentUserEmail = null;
            document.getElementById('sidebar-logged-out').style.display = 'block';
            document.getElementById('sidebar-logged-in').style.display = 'none';
            document.getElementById('chat-input-field').disabled = true;
            document.getElementById('send-btn').disabled = true;
            document.getElementById('image-upload-btn').disabled = true;
            applyChatLanguage(currentLang);
        }
    });

    window.logout = function() {
        signOut(auth).then(() => {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Logout failed', error);
            window.location.href = 'login.html';
        });
    };

    function toggleSidebarLang() {
        const list = document.getElementById('sidebar-lang-list');
        if (!list) return;
        list.style.display = (list.style.display === 'block') ? 'none' : 'block';
    }
    

    // Initialize language on page load
    function initializeChatLanguage() {
        const savedLang = localStorage.getItem('selectedLang') || 'en';
        applyChatLanguage(savedLang);
    }

    // Call immediately and also on DOMContentLoaded to ensure it runs
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeChatLanguage);
    } else {
        initializeChatLanguage();
    }
</script>
</body>
</html>
