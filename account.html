<!DOCTYPE html>
<html lang="my">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLG Bullion - Account Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --color-dark-bg: #111111; 
            --color-medium-dark: #151920; 
            --color-gold-accent: #FFD700; 
            --color-text-light: #E6E9EE; 
            --color-text-fade: #9aa0b3; 
            --color-positive: #00B050; 
            --color-negative: #D93025; 

            --bg: var(--color-dark-bg);
            --panel: var(--color-medium-dark);
            --muted: var(--color-text-fade);
            --text: var(--color-text-light);
            --gold: var(--color-gold-accent);
            --shadow: 0 18px 50px rgba(0,0,0,0.18);
        }
        
        body { 
            font-family: 'Noto Sans Myanmar', 'Noto Sans Thai', 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--color-dark-bg); 
            color: var(--color-text-light); 
            margin: 0; 
            display: flex; 
        }
        
        /* Sidebar Styling */
        .sidebar { 
            width: 240px; 
            height: 100vh; 
            background: var(--panel); 
            border-right: 1px solid #333; 
            position: fixed; 
            display: flex;
            flex-direction: column;
            box-shadow: none;
        }
        
        .main-content { 
            margin-left: 240px; 
            padding: 28px; 
            width: calc(100% - 240px); 
        }
        
        /* Branding Section */
        .brand-header { 
            padding: 25px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        
        .logo-img { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: 2px solid var(--color-gold-accent); 
            object-fit: cover; 
        }
        
        .logo-text-group h2 {
            margin: 0;
            line-height: 1.1;
        }

        /* Navigation */
        .nav-list {
            margin-top: 20px;
            padding: 0;
            list-style: none;
        }

        .nav-item { 
            padding: 15px 20px; 
            color: var(--color-text-fade); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            transition: 0.3s;
        }
        
        .nav-item i {
            width: 20px;
            margin-right: 15px;
            text-align: center;
        }

        .nav-item:hover, .nav-item.active { 
            color: var(--color-gold-accent); 
            background: #252525; 
            border-left: 4px solid var(--color-gold-accent); 
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css">
</head>
